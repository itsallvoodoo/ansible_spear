---
controller_templates:
  - name: "Compliance | Setup | Build Compliance Server"
    description: "Installs STIG Manager, OpenRMF, and Keycloak on target server"
    playbook: "playbooks/stig_server_deploy.yml"
    project: "STIG & Compliance Automation"
    execution_environment: "Compliance Evaluation EE"
    inventory: "Ansible Product Demos Inventory"
    limit: "{{ server_fqdn }}"
    ask_limit_on_launch: true

  - name: "Compliance | Setup | Clean Compliance Server"
    description: "Removes STIG Manager, OpenRMF, and Keycloak from target server"
    playbook: "playbooks/stig_server_clean.yml"
    project: "STIG & Compliance Automation"
    execution_environment: "Compliance Evaluation EE"
    inventory: "Ansible Product Demos Inventory"
    limit: "{{ server_fqdn }}"
    ask_limit_on_launch: true

  - name: "Compliance | Remediation | Remediate Linux Servers (light)"
    description: "Runs a subset of STIG remediations against Linux hosts"
    playbook: "playbooks/remediate_light_linux.yml"
    project: "STIG & Compliance Automation"
    execution_environment: "Compliance Evaluation EE"
    inventory: "Ansible Product Demos Inventory"
    ask_limit_on_launch: true

  - name: "Compliance | Remediation | Remediate Linux Servers (full)"
    description: "Runs all STIG remediations against Linux hosts"
    playbook: "playbooks/remediate_full_linux.yml"
    project: "STIG & Compliance Automation"
    execution_environment: "Compliance Evaluation EE"
    inventory: "Ansible Product Demos Inventory"
    ask_limit_on_launch: true

  - name: "Compliance | Remediation | Remediate Windows Servers (full)"
    description: "Runs all STIG remediations against Windows hosts"
    playbook: "playbooks/remediate_full_windows.yml"
    project: "STIG & Compliance Automation"
    execution_environment: "Compliance Evaluation EE"
    inventory: "Ansible Product Demos Inventory"
    ask_limit_on_launch: true

  - name: "Compliance | Scanning | Scan servers with Evaluate STIG"
    description: "Scans hosts and generates ckl/cklb/xml files - NEEDS proprietary binary!"
    playbook: "playbooks/scan_evaluatestig.yml"
    project: "STIG & Compliance Automation"
    execution_environment: "Compliance Evaluation EE"
    inventory: "Ansible Product Demos Inventory"
    ask_limit_on_launch: true

  - name: "Compliance | Scanning | Scan servers with DISA SCC"
    description: "Scans hosts and generates ckl/cklb/xml files with DISA scc"
    playbook: "playbooks/scan_scc.yml"
    project: "STIG & Compliance Automation"
    execution_environment: "Compliance Evaluation EE"
    inventory: "Ansible Product Demos Inventory"
    ask_limit_on_launch: true

...