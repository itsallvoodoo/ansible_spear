---
- name: Compliance | Windows | Remediate Servers (full) - Supports Windows 11, 2022
  hosts: "{{ limit | default('all') }}"
  gather_facts: false
  strategy: free

  tasks:

  - name: Run fact gathering via stdin due to inability to use /tmp when STIGs are applied 
    ansible.builtin.setup:
    vars:
      ansible_pipelining: true

  - name: "====================================== Windows Remediation ======================================"
    block:
      - name: "---------- Compliance | Remediation | Windows | Remediate Windows 11 (Full) ----------"
        ansible.builtin.include_role:
          name: ../roles/Windows-11-STIG
        when:
          - "'Windows 11' in ansible_facts['distribution']"

      # Addressing WN19-AC-000020 failure
      - name: Pre-configure Account Lockout baseline to satisfy Windows secedit constraints
        ansible.windows.win_shell: >
          net accounts /lockoutthreshold:3 /lockoutduration:15 /lockoutwindow:15

      - name: "---------- Compliance | Remediation | Windows | Remediate Windows Server 2019 (Full) ----------"
        ansible.builtin.include_role:
          name: ../roles/Windows-2019-STIG
        when:
          - "'2019' in ansible_facts['distribution']"

      - name: "---------- Compliance | Remediation | Windows | Remediate Windows Server 2022 (Full) ----------"
        ansible.builtin.include_role:
          name: ../roles/Windows-2022-STIG
        when:
          - "'2022' in ansible_facts['distribution']"
    when: ansible_facts['os_family'] == "Windows"

...
  