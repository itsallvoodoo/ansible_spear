---
# tasks file for stig_server_deploy

# ------------------------------------------------------------------
# System Dependencies & Networking
# ------------------------------------------------------------------
- name: General | Determine dynamic server IP address
  ansible.builtin.set_fact:
    app_server_ip: "{{ ansible_host | default(ansible_facts['default_ipv4']['address']) }}"
  tags:
    - general

- name: General | Set dynamic service URL endpoints
  ansible.builtin.set_fact:
    auth_server_fqdn: "http://{{ app_server_ip }}:{{ keycloak_host_port }}"
    # stigman_server_fqdn: "http://{{ app_server_ip }}:{{ stigman_host_port }}"
    openrmf_server_fqdn: "http://{{ app_server_ip }}:{{ openrmf_host_port }}"
  when: not (use_fqdn | bool)
  tags:
    - general

- name: General | Install Podman, npm, and other dependencies
  ansible.builtin.dnf:
    name:
      - podman
      - python3-pip
      - nodejs
      - npm
      - firewalld
      - python3-firewall
      - policycoreutils-python-utils
      - unzip
      - tar
    state: present
  tags:
    - general

- name: General | Install podman-compose system-wide via pip
  ansible.builtin.pip:
    name: podman-compose
    executable: pip3
    state: present
  tags:
    - general

- name: General | Symlink podman-compose into /usr/bin for global provider lookup
  ansible.builtin.file:
    src: /usr/local/bin/podman-compose
    dest: /usr/bin/podman-compose
    state: link
    force: true
  tags:
    - general

- name: General | Ensure firewalld service is started and enabled
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  tags:
    - general

- name: General | Open firewall ports for OpenRMF, STIG Manager, and Keycloak
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    #- "{{ stigman_host_port }}/tcp"  # STIG Manager UI
    - "{{ openrmf_host_port }}/tcp" # OpenRMF UI
    - "{{ keycloak_host_port }}/tcp" # Keycloak Admin/Login UI
  tags:
    - general

- name: "General | Add firewall rules to AWS security group {{ aws_security_group }} when deploying to AWS"
  amazon.aws.ec2_security_group:
    name: "{{ aws_security_group }}"
    region: "{{ aws_region | default('us-east-2') }}"
    description: "Security group for RMF test server"
    state: present
    purge_rules: false
    purge_rules_egress: false
    rules:
      #- proto: tcp
      #  from_port: "{{ stigman_host_port }}"
      #  to_port: "{{ stigman_host_port }}"
      #  cidr_ip: 0.0.0.0/0
      #  rule_desc: "Allow STIG Manager UI"
      - proto: tcp
        from_port: "{{ keycloak_host_port }}"
        to_port: "{{ keycloak_host_port }}"
        cidr_ip: 0.0.0.0/0
        rule_desc: "Allow Keycloak UI"
      - proto: tcp
        from_port: "{{ openrmf_host_port }}"
        to_port: "{{ openrmf_host_port }}"
        cidr_ip: 0.0.0.0/0
        rule_desc: "Allow OpenRMF UI"
  delegate_to: localhost
  vars:
    ansible_become: false
    ansible_connection: local
  when: apd_deployment | bool
  tags:
    - general

# ------------------------------------------------------------------
# Setup service account
# ------------------------------------------------------------------
- name: General | Create stig-svc-account service user
  ansible.builtin.user:
    name: "{{ server_svc_account }}"
    comment: "Service account for rootless Podman compliance containers"
    shell: /bin/bash
    create_home: true
    state: present
  tags:
    - general

- name: "General | Enable loginctl lingering for {{ server_svc_account }}"
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ server_svc_account }}"
    creates: "/var/lib/systemd/linger/{{ server_svc_account }}"
  tags:
    - general

- name: General | Ensure Ansible remote_tmp directory exists for service account
  ansible.builtin.file:
    path: "/home/{{ server_svc_account }}/.ansible/tmp"
    state: directory
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0700'
  tags:
    - general

- name: General | Ensure subuid/subgid allocations exist for service account
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    line: "{{ server_svc_account }}:100000:65536"
    regexp: "^{{ server_svc_account }}:"
    state: present
  loop:
    - subuid
    - subgid
  tags:
    - general

- name: General | Get UID of service account
  ansible.builtin.command: "id -u {{ server_svc_account }}"
  register: stig_svc_uid
  changed_when: false
  tags:
    - general

- name: General | Ensure user runtime directory exists
  ansible.builtin.file:
    path: "/run/user/{{ stig_svc_uid.stdout }}"
    state: directory
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0700'
  tags:
    - general

- name: "General | Retrieve UID for {{ server_svc_account }}"
  ansible.builtin.getent:
    database: passwd
    key: "{{ server_svc_account }}"
  tags:
    - general

- name: General | Set facts for rootless environment
  ansible.builtin.set_fact:
    stig_uid: "{{ ansible_facts['getent_passwd'][server_svc_account][1] }}"
  tags:
    - general

- name: General | Create user systemd directory for rootless services
  ansible.builtin.file:
    path: "/home/{{ server_svc_account }}/.config/systemd/user"
    state: directory
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0755'
  become: true
  tags:
    - general

# ------------------------------------------------------------------
# Host Directories, SQL Initialization, & SELinux Contexts
# ------------------------------------------------------------------
- name: General | Create host directories for MySQL and Keycloak
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0755'
  loop:
    - "{{ mysql_data_dir }}"
    - "{{ mysql_init_dir }}"
    - "{{ keycloak_import_dir }}"
  tags:
    - general

- name: General | Ensure watched directory exists for incoming CKL/XML scan files
  ansible.builtin.file:
    path: "{{ nfs_upload_folder }}"
    state: directory
    owner: "{{ nfs_user }}"
    group: "{{ nfs_user }}"
    mode: '0777'
  tags:
    - general

- name: OPENRMF | Copy exported openrmf Keycloak realm JSON to target host
  ansible.builtin.template:
    src: "{{ openrmf_realm_export_template }}"
    dest: "{{ keycloak_import_dir }}/openrmf-realm-export.json"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0644'
  tags:
    - openrmf

- name: General | Generate MySQL database initialization SQL script
  ansible.builtin.copy:
    dest: "{{ mysql_init_dir }}/01-init-databases.sql"
    mode: '0644'
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    content: |
      CREATE DATABASE IF NOT EXISTS keycloak;
      CREATE USER IF NOT EXISTS 'keycloak'@'%' IDENTIFIED BY '{{ keycloak_db_password }}';
      GRANT ALL PRIVILEGES ON keycloak.* TO 'keycloak'@'%';

      FLUSH PRIVILEGES;
  tags:
    - general

- name: General | Set SELinux file context for container volume mounts
  community.general.sefcontext:
    target: "{{ base_dir }}(/.*)?"
    setype: container_file_t
    state: present
  tags:
    - general

- name: General | Apply SELinux contexts using restorecon
  ansible.builtin.command:
    cmd: "restorecon -R {{ base_dir }}"
  changed_when: false
  tags:
    - general

# ------------------------------------------------------------------
# Deploy Containers inside a Single Podman Pod
# ------------------------------------------------------------------
- name: General | Ensure Python Podman bindings exist for Ansible
  ansible.builtin.pip:
    name: podman
    state: present
  tags:
    - general

- name: General | Create Podman Pod for entire stack
  containers.podman.podman_pod:
    name: general-pod
    state: created
    ports:
      #- "{{ stigman_host_port }}:54000" # STIG Manager
      - "{{ keycloak_host_port }}:8080" # Keycloak
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_uid }}"
  tags:
    - general

- name: General | Check if pod systemd service exists
  ansible.builtin.stat:
    path: "/home/{{ server_svc_account }}/.config/systemd/user/pod-general-pod.service"
  register: pod_service_file
  become: true
  become_user: "{{ server_svc_account }}"
  tags:
    - general

- name: General | Deploy Keycloak OIDC Container with Auto-Realm Import
  containers.podman.podman_container:
    name: keycloak-app
    pod: general-pod
    image: "{{ keycloak_image }}"
    state: started
    restart_policy: always
    command: "start-dev --import-realm"
    env:
      KEYCLOAK_ADMIN: "{{ keycloak_admin_user }}"
      KEYCLOAK_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
      KC_DB: "mysql"
      KC_DB_URL_HOST: "127.0.0.1"
      KC_DB_URL_PORT: "3306"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "{{ keycloak_db_password }}"
      KC_HTTP_ENABLED: "true"
      #KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_RELATIVE_PATH: "/"
    volume:
      - "{{ keycloak_import_dir }}:/opt/keycloak/data/import:Z"
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_uid }}"
  tags:
    - general

# ------------------------------------------------------------------
# Enable Boot Persistence via Systemd
# ------------------------------------------------------------------
- name: General | Generate systemd service for Podman Pod
  containers.podman.podman_generate_systemd:
    name: general-pod
    dest: "/home/{{ server_svc_account }}/.config/systemd/user"
    new: true
    restart_policy: always
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_uid }}"
  when: not pod_service_file.stat.exists
  tags:
    - general

- name: General | Stop running pod to hand control to systemd
  containers.podman.podman_pod:
    name: general-pod
    state: stopped
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_uid }}"
  when: not pod_service_file.stat.exists
  tags:
    - general

- name: General | Reload user systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ stig_uid }}/bus"
  when: not pod_service_file.stat.exists
  tags:
    - general

- name: General | Enable and start General pod service
  ansible.builtin.systemd:
    name: pod-general-pod.service
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ stig_uid }}/bus"
  tags:
    - general

# ------------------------------------------------------------------
# Create Users in Keycloak
# ------------------------------------------------------------------

- name: General | Authenticate kcadm CLI inside Keycloak container
  ansible.builtin.command: >
    podman exec keycloak-app /opt/keycloak/bin/kcadm.sh config credentials
    --server http://localhost:8080
    --realm master
    --user {{ keycloak_admin_user }}
    --password {{ keycloak_admin_password }}
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_uid }}"
  changed_when: false
  tags:
    - general

- name: General | Disable SSL requirement on master realm
  ansible.builtin.command: >
    podman exec keycloak-app /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_uid }}"
  register: master_ssl_update
  changed_when: "'sslRequired' in master_ssl_update.stdout or master_ssl_update.rc == 0"
  tags:
    - general

- name: OPENRMF | Ensure OpenRMF Admin User exists in Keycloak
  community.general.keycloak_user:
    auth_keycloak_url: "http://127.0.0.1:{{ keycloak_host_port }}"
    auth_realm: "master"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ openrmf_keycloak_realm }}"
    username: "{{ openrmf_username }}"
    firstName: "{{ openrmf_firstname }}"
    lastName: "{{ openrmf_lastname }}"
    email: "{{ openrmf_email }}"
    enabled: true
    credentials:
      - type: password
        value: "{{ openrmf_password }}"
        temporary: false
    state: present
  tags:
    - openrmf

- name: OPENRMF | Assign Realm Roles to OpenRMF User
  community.general.keycloak_user_rolemapping:
    auth_keycloak_url: "http://127.0.0.1:{{ keycloak_host_port }}"
    auth_realm: "master"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ openrmf_keycloak_realm }}"
    target_username: "{{ openrmf_username }}"
    roles:
      - name: Administrator
      - name: Assessor
      - name: Download
      - name: Editor
      - name: offline_access
      - name: Reader
    state: present
  tags:
    - openrmf

# ------------------------------------------------------------------
# Stand up OpenRMF Application Deployment
# ------------------------------------------------------------------
- name: OPENRMF | Ensure OpenRMF installation directory exists
  ansible.builtin.file:
    path: "{{ openrmf_install_dir }}"
    state: directory
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0755'
  tags:
    - openrmf

- name: OPENRMF | Unarchive OpenRMF release archive to target host
  ansible.builtin.unarchive:
    src: "{{ openrmf_zip_file }}"
    dest: "{{ openrmf_install_dir }}"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    remote_src: false
  tags:
    - openrmf

- name: OPENRMF | Remap openrmf-web host port from 8080 to 9080 directly in docker-compose.yml
  ansible.builtin.replace:
    path: "{{ openrmf_install_dir }}/docker-compose.yml"
    regexp: '8080:8080'
    replace: '9080:8080'

- name: OPENRMF | Ensure auth.js volume mount is present in docker-compose.yml
  ansible.builtin.lineinfile:
    path: "{{ openrmf_install_dir }}/docker-compose.yml"
    line: '      - ./auth.js:/usr/share/nginx/html/js/auth.js:z'
    insertafter: '.*nginx\.conf.*'
  tags:
    - openrmf

- name: OPENRMF | Deploy OpenRMF .env configuration
  ansible.builtin.copy:
    dest: "{{ openrmf_install_dir }}/.env"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0600'
    content: |
      JWTAUTHORITY={{ auth_server_fqdn }}/realms/{{ openrmf_keycloak_realm }}
      JWTINTERNALAUTHORITY={{ auth_server_fqdn }}/
      JWTCLIENT={{ openrmf_keycloak_realm }}
      OPENRMF_HOST={{ openrmf_server_fqdn }}
  tags:
    - openrmf

- name: OPENRMF | Deploy external Keycloak JS config (auth.js)
  ansible.builtin.copy:
    dest: "{{ openrmf_install_dir }}/auth.js"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0644'
    content: |
      var keycloak = new Keycloak({
        url: '{{ auth_server_fqdn }}',
        realm: '{{ openrmf_keycloak_realm }}',
        clientId: '{{ openrmf_keycloak_realm }}'
      });
  tags:
    - openrmf

- name: OPENRMF | Convert compose scripts to use podman if applicable
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: 'docker compose'
    replace: 'podman compose'
  loop:
    - "{{ openrmf_install_dir }}/start.sh"
    - "{{ openrmf_install_dir }}/stop.sh"
  tags:
    - openrmf

- name: OPENRMF | Ensure OpenRMF execution scripts are executable
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0755'
  loop:
    - "{{ openrmf_install_dir }}/start.sh"
    - "{{ openrmf_install_dir }}/stop.sh"
  tags:
    - openrmf

- name: OPENRMF | Launch OpenRMF stack as service account
  ansible.builtin.command:
    cmd: "systemd-run --user --scope ./start.sh"
    chdir: "{{ openrmf_install_dir }}"
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    HOME: "/home/{{ server_svc_account }}"
    LOGNAME: "{{ server_svc_account }}"
    USER: "{{ server_svc_account }}"
    PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_facts['env']['PATH'] }}"
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ stig_svc_uid.stdout }}/bus"
  register: openrmf_start
  changed_when: openrmf_start.rc == 0
  tags:
    - openrmf

- name: General | Display deployment summary details
  ansible.builtin.debug:
    msg: |
      ======================================================
      DEPLOYMENT SUMMARY DETAILS
      ======================================================
      App Server IP:          {{ app_server_ip }}
      Auth Server FQDN:       {{ auth_server_fqdn }}
      OpenRMF Server FQDN:    {{ openrmf_server_fqdn }}
      STIG Manager FQDN:      {{ stigman_server_fqdn }}
      ======================================================
  tags:
    - general

...