---
# tasks file for rmf_server_deploy

# ------------------------------------------------------------------
# System Dependencies & Networking
# ------------------------------------------------------------------
- name: General | IP management if installing in APD
  block:
    - name: General | Determine dynamic server IP address
      ansible.builtin.set_fact:
        app_server_ip: "{{ ansible_host | default(ansible_facts['default_ipv4']['address']) }}"

    - name: General | Set dynamic service URL endpoints
      ansible.builtin.set_fact:
        auth_server_fqdn: "https://{{ app_server_ip }}:{{ keycloak_host_port }}"
        openrmf_server_fqdn: "https://{{ app_server_ip }}:{{ openrmf_host_port }}"
        stigman_server_fqdn: "https://{{ app_server_ip }}:{{ stigman_host_port }}" 
  when: not (use_fqdn | bool)
  tags:
    - general

- name: General | Install Podman, npm, and system dependencies
  ansible.builtin.dnf:
    name:
      - podman
      - nginx
      - python3-pip
      - nodejs
      - npm
      - firewalld
      - python3-firewall
      - policycoreutils-python-utils
      - unzip
      - tar
    state: present
  tags:
    - general

- name: General | Install podman-compose system-wide via pip
  ansible.builtin.pip:
    name: podman-compose
    executable: pip3
    state: present
  tags:
    - general

- name: General | Symlink podman-compose into /usr/bin for global provider lookup
  ansible.builtin.file:
    src: /usr/local/bin/podman-compose
    dest: /usr/bin/podman-compose
    state: link
    force: true
  tags:
    - general

- name: General | Allow NGINX to reverse-proxy to backend network sockets
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  tags:
    - general

- name: General | Allow NGINX to listen on custom application ports (SELinux)
  community.general.seport:
    ports: "{{ item }}"
    proto: tcp
    setype: http_port_t
    state: present
  loop:
    - "{{ keycloak_host_port }}"
    - "{{ stigman_host_port }}"
    - "{{ openrmf_host_port }}"
  tags:
    - general

- name: General | Ensure firewalld service is started and enabled
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  tags:
    - general

- name: General | Open firewall ports for NGINX Proxy (OpenRMF, STIGMan, and Keycloak)
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ openrmf_host_port }}/tcp"
    - "{{ keycloak_host_port }}/tcp"
    - "{{ stigman_host_port }}/tcp"
  tags:
    - general

- name: "General | Add firewall rules to AWS security group {{ aws_security_group }} when deploying to AWS"
  amazon.aws.ec2_security_group:
    name: "{{ aws_security_group }}"
    region: "{{ aws_region | default('us-east-2') }}"
    description: "Security group for OpenRMF server"
    state: present
    purge_rules: false
    purge_rules_egress: false
    rules:
      - proto: tcp
        from_port: "{{ stigman_host_port }}"
        to_port: "{{ stigman_host_port }}"
        cidr_ip: 0.0.0.0/0
        rule_desc: "Allow STIG Manager UI"
      - proto: tcp
        from_port: "{{ keycloak_host_port }}"
        to_port: "{{ keycloak_host_port }}"
        cidr_ip: 0.0.0.0/0
        rule_desc: "Allow Keycloak UI"
      - proto: tcp
        from_port: "{{ openrmf_host_port }}"
        to_port: "{{ openrmf_host_port }}"
        cidr_ip: 0.0.0.0/0
        rule_desc: "Allow OpenRMF UI"
  delegate_to: localhost
  vars:
    ansible_become: false
    ansible_connection: local
  when: apd_deployment | default(false) | bool
  tags:
    - general

# ------------------------------------------------------------------
# Setup Service Account & Rootless Podman Environment
# ------------------------------------------------------------------
- name: "General | Create {{ server_svc_account }} service user account"
  ansible.builtin.user:
    name: "{{ server_svc_account }}"
    comment: "Service account for rootless Podman containers"
    shell: /bin/bash
    create_home: true
    state: present
  tags:
    - general

- name: "General | Enable loginctl lingering for {{ server_svc_account }}"
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ server_svc_account }}"
    creates: "/var/lib/systemd/linger/{{ server_svc_account }}"
  tags:
    - general

- name: General | Ensure Ansible remote_tmp directory exists for service account
  ansible.builtin.file:
    path: "/home/{{ server_svc_account }}/.ansible/tmp"
    state: directory
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0700'
  tags:
    - general

- name: General | Ensure subuid/subgid allocations exist for service account
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    line: "{{ server_svc_account }}:100000:65536"
    regexp: "^{{ server_svc_account }}:"
    state: present
  loop:
    - subuid
    - subgid
  tags:
    - general

- name: General | Get UID of service account
  ansible.builtin.command: "id -u {{ server_svc_account }}"
  register: stig_svc_uid
  changed_when: false
  tags:
    - general

- name: General | Ensure user runtime directory exists
  ansible.builtin.file:
    path: "/run/user/{{ stig_svc_uid.stdout }}"
    state: directory
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0700'
  tags:
    - general

# In original, not in new
# - name: General | Create user systemd directory for rootless services
#   ansible.builtin.file:
#     path: "/home/{{ server_svc_account }}/.config/systemd/user"
#     state: directory
#     owner: "{{ server_svc_account }}"
#     group: "{{ server_svc_account }}"
#     mode: '0755'
#   become: true
#   tags:
#     - general


# ------------------------------------------------------------------
# Host Directories, SQL Initialization, & SELinux Contexts
# ------------------------------------------------------------------
- name: General | Create host directories for MySQL, Keycloak, and OpenRMF
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0755'
  loop:
    - "{{ mysql_data_dir }}"
    - "{{ mysql_init_dir }}"
    - "{{ keycloak_import_dir }}"
    - "{{ openrmf_install_dir }}"
  tags:
    - general

- name: General | Ensure watched directory exists for incoming scan files
  ansible.builtin.file:
    path: "{{ nfs_upload_folder }}"
    state: directory
    owner: "{{ nfs_user }}"
    group: "{{ nfs_user }}"
    mode: '0777'
  tags:
    - general

- name: STIGMAN | Copy exported stigman Keycloak realm JSON to target host
  ansible.builtin.template:
    src: "{{ stigman_realm_export_template }}"
    dest: "{{ keycloak_import_dir }}/stigman-realm-export.json"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0644'
  tags:
    - stigman

- name: OPENRMF | Copy exported openrmf Keycloak realm JSON to target host
  ansible.builtin.template:
    src: "{{ openrmf_realm_export_template }}"
    dest: "{{ keycloak_import_dir }}/openrmf-realm-export.json"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0644'
  tags:
    - openrmf

- name: General | Generate MySQL database initialization SQL script
  ansible.builtin.copy:
    dest: "{{ mysql_init_dir }}/01-init-databases.sql"
    mode: '0644'
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    content: |
      CREATE DATABASE IF NOT EXISTS stigman;
      CREATE USER IF NOT EXISTS 'stigman'@'%' IDENTIFIED BY '{{ stigman_db_password }}';
      GRANT ALL PRIVILEGES ON stigman.* TO 'stigman'@'%';

      CREATE DATABASE IF NOT EXISTS keycloak;
      CREATE USER IF NOT EXISTS 'keycloak'@'%' IDENTIFIED BY '{{ keycloak_db_password }}';
      GRANT ALL PRIVILEGES ON keycloak.* TO 'keycloak'@'%';

      FLUSH PRIVILEGES;
  tags:
    - general

- name: General | Set SELinux file context for container volume mounts
  community.general.sefcontext:
    target: "{{ base_dir }}(/.*)?"
    setype: container_file_t
    state: present
  tags:
    - general

- name: General | Apply SELinux contexts using restorecon
  ansible.builtin.command:
    cmd: "restorecon -R {{ base_dir }}"
  changed_when: false
  tags:
    - general

# ------------------------------------------------------------------
# Deploy Database & Keycloak inside general-pod
# ------------------------------------------------------------------
- name: General | Create Podman Pod for core stack
  containers.podman.podman_pod:
    name: general-pod
    state: created
    ports:
      - "{{ keycloak_internal_port }}:8080"
      - "{{ stigman_internal_port }}:54000"
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  tags:
    - general

- name: General | Check if pod systemd service exists
  ansible.builtin.stat:
    path: "/home/{{ server_svc_account }}/.config/systemd/user/pod-general-pod.service"
  register: pod_service_file
  become: true
  become_user: "{{ server_svc_account }}"
  tags:
    - general

- name: General | Deploy MySQL Container
  containers.podman.podman_container:
    name: mysql-app
    pod: general-pod
    image: "{{ mysql_image }}"
    state: started
    restart_policy: always
    env:
      MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
    volume:
      - "{{ mysql_data_dir }}:/var/lib/mysql:Z"
      - "{{ mysql_init_dir }}:/docker-entrypoint-initdb.d:Z"
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  tags:
    - general

- name: General | Wait for MySQL to finish initialization and accept connections
  ansible.builtin.command: >
    podman exec mysql-app mysqladmin ping -h 127.0.0.1 -u root -p"{{ mysql_root_password }}"
  register: mysql_ping
  until: mysql_ping.rc == 0
  retries: 30
  delay: 5
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  changed_when: false
  tags:
    - general

- name: General | Deploy Keycloak OIDC Container with Auto-Realm Import
  containers.podman.podman_container:
    name: keycloak-app
    pod: general-pod
    image: "{{ keycloak_image }}"
    state: started
    restart_policy: always
    command: "start-dev --import-realm"
    env:
      KEYCLOAK_ADMIN: "{{ keycloak_admin_user }}"
      KEYCLOAK_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
      KC_DB: "mysql"
      KC_DB_URL_HOST: "127.0.0.1"
      KC_DB_URL_PORT: "3306"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "{{ keycloak_db_password }}"
      KC_HTTP_ENABLED: "true"

      # Reverse Proxy and Hostname Settings
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_RELATIVE_PATH: "/"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"

    volume:
      - "{{ keycloak_import_dir }}:/opt/keycloak/data/import:Z"
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  tags:
    - general

- name: STIGMAN | Deploy STIG Manager Application Container
  containers.podman.podman_container:
    name: stigman-app
    pod: general-pod
    image: "{{ stigman_image }}"
    state: started
    restart_policy: always
    env:
      STIGMAN_DB_HOST: "127.0.0.1"
      STIGMAN_DB_PORT: "3306"
      STIGMAN_DB_SCHEMA: "{{ stigman_keycloak_realm }}"
      STIGMAN_DB_USER: "{{ stigman_keycloak_realm }}"
      STIGMAN_DB_PASSWORD: "{{ stigman_db_password }}"
      # http://host.containers.internal:{{ keycloak_host_port }}
      STIGMAN_OIDC_PROVIDER: "http://127.0.0.1:8080/realms/{{ stigman_keycloak_realm }}"
      STIGMAN_CLIENT_OIDC_PROVIDER: "{{ auth_server_fqdn }}/realms/{{ stigman_keycloak_realm }}"
      STIGMAN_CLIENT_OIDC_CLIENT_ID: "{{ stigman_keycloak_client_id }}"
      STIGMAN_CLASSIFICATION: U
      STIGMAN_API_TLS_ENABLED: "false"
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  tags:
    - stigman



# ------------------------------------------------------------------
# Enable Boot Persistence via Systemd
# ------------------------------------------------------------------
- name: General | Generate systemd service for Podman Pod
  containers.podman.podman_generate_systemd:
    name: general-pod
    dest: "/home/{{ server_svc_account }}/.config/systemd/user"
    new: true
    restart_policy: always
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  when: not pod_service_file.stat.exists
  tags:
    - general

- name: General | Stop running pod to hand control to systemd
  ansible.builtin.command: >
    podman pod stop -t 60 general-pod
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  when: not pod_service_file.stat.exists
  register: pod_stop_result
  changed_when: pod_stop_result.rc == 0
  failed_when:
    - pod_stop_result.rc != 0
    - "'no such pod' not in pod_stop_result.stderr"
    - "'is already stopped' not in pod_stop_result.stderr"
  tags:
    - general

- name: General | Reload user systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ stig_svc_uid.stdout }}/bus"
  when: not pod_service_file.stat.exists
  tags:
    - general

- name: General | Enable and start General pod service
  ansible.builtin.systemd:
    name: pod-general-pod.service
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ stig_svc_uid.stdout }}/bus"
  tags:
    - general

- name: General | Keycloak service to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ keycloak_internal_port }}/realms/master"
    status_code: 200
  register: keycloak_health
  until: keycloak_health.status | default(-1) == 200
  retries: 75
  delay: 5
  tags:
    - general

# ------------------------------------------------------------------
# Disable SSL Enforcement for HTTP Access
# ------------------------------------------------------------------
- name: General | Authenticate kcadm CLI inside Keycloak container
  ansible.builtin.command: >
    podman exec keycloak-app /opt/keycloak/bin/kcadm.sh config credentials
    --server http://localhost:8080
    --realm master
    --user {{ keycloak_admin_user }}
    --password {{ keycloak_admin_password }}
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  changed_when: false
  tags:
    - general

- name: General | Disable SSL requirement on master realm
  ansible.builtin.command: >
    podman exec keycloak-app /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  register: master_ssl_update
  changed_when: "'sslRequired' in master_ssl_update.stdout or master_ssl_update.rc == 0"
  tags:
    - general

- name: OPENRMF | Disable SSL requirement on OpenRMF realm
  ansible.builtin.command: >
    podman exec keycloak-app /opt/keycloak/bin/kcadm.sh update realms/{{ openrmf_keycloak_realm }} -s sslRequired=NONE
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  register: openrmf_ssl_update
  changed_when: "'sslRequired' in openrmf_ssl_update.stdout or openrmf_ssl_update.rc == 0"
  tags:
    - openrmf

- name: OPENRMF | Disable SSL requirement on STIG Manager realm
  ansible.builtin.command: >
    podman exec keycloak-app /opt/keycloak/bin/kcadm.sh update realms/{{ stigman_keycloak_realm }} -s sslRequired=NONE
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
  register: openrmf_ssl_update
  changed_when: "'sslRequired' in openrmf_ssl_update.stdout or openrmf_ssl_update.rc == 0"
  tags:
    - stigman

# ------------------------------------------------------------------
# Provision Users & Roles in Keycloak
# ------------------------------------------------------------------
- name: OPENRMF | Ensure OpenRMF Admin User exists in Keycloak
  community.general.keycloak_user:
    auth_keycloak_url: "http://127.0.0.1:{{ keycloak_internal_port }}"
    auth_realm: "master"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ openrmf_keycloak_realm }}"
    username: "{{ openrmf_username }}"
    firstName: "{{ openrmf_firstname }}"
    lastName: "{{ openrmf_lastname }}"
    email: "{{ openrmf_email }}"
    enabled: true
    credentials:
      - type: password
        value: "{{ openrmf_password }}"
        temporary: false
    state: present
  tags:
    - openrmf

- name: STIGMAN | Ensure STIG Manager Admin User exists in Keycloak
  community.general.keycloak_user:
    auth_keycloak_url: "http://127.0.0.1:{{ keycloak_internal_port }}"
    auth_realm: "master"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ stigman_keycloak_realm }}"
    username: "{{ stigman_username }}"
    firstName: "{{ stigman_firstname }}"
    lastName: "{{ stigman_lastname }}"
    email: "{{ stigman_email }}"
    enabled: true
    credentials:
      - type: password
        value: "{{ stigman_password }}"
        temporary: false
    state: present
  tags:
    - stigman

- name: OPENRMF | Assign Realm Roles to OpenRMF User
  community.general.keycloak_user_rolemapping:
    auth_keycloak_url: "http://127.0.0.1:{{ keycloak_internal_port }}"
    auth_realm: "master"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ openrmf_keycloak_realm }}"
    target_username: "{{ openrmf_username }}"
    roles:
      - name: Administrator
      - name: Assessor
      - name: Download
      - name: Editor
      - name: offline_access
      - name: Reader
    state: present
  tags:
    - openrmf

- name: STIGMAN | Assign Realm Roles to STIG Manager User
  community.general.keycloak_user_rolemapping:
    auth_keycloak_url: "http://127.0.0.1:{{ keycloak_internal_port }}"
    auth_realm: "master"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ stigman_keycloak_realm }}"
    target_username: "{{ stigman_username }}"
    roles:
      - name: user
      - name: admin
      - name: create_collection
    state: present
  tags:
    - stigman

# ------------------------------------------------------------------
# Get Tokens & Trigger Watcher JIT User Creation
# ------------------------------------------------------------------
- name: STIGMAN | Wait for STIG Manager OIDC connection to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stigman_internal_port}}/api/op/definition"
    method: GET
    status_code: 200
  register: stigman_health
  until: stigman_health.status == 200
  retries: 30
  delay: 10
  tags:
    - stigman

- name: STIGMAN | Get Admin Bearer Token for STIG Manager API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ keycloak_internal_port }}/realms/{{ stigman_keycloak_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: "password"
      client_id: "{{ stigman_keycloak_client_id }}"
      username: "{{ stigman_username }}"
      password: "{{ stigman_password }}"
    status_code: 200
  register: keycloak_token
  tags:
    - stigman

- name: STIGMAN | Get Bearer Token for Watcher Service Account
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ keycloak_internal_port }}/realms/{{ stigman_keycloak_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: "client_credentials"
      client_id: "{{ watcher_client_id }}"
      client_secret: "{{ watcher_client_secret }}"
    status_code: 200
  register: watcher_token
  tags:
    - stigman

- name: STIGMAN | Trigger JIT User Creation in STIG Manager for Watcher
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stigman_internal_port }}/api/stigs"
    method: GET
    headers:
      Authorization: "Bearer {{ watcher_token.json.access_token }}"
    status_code: 200
  tags:
    - stigman

# ------------------------------------------------------------------
# Fetch Users & Build Initial Grants Payload
# ------------------------------------------------------------------
- name: STIGMAN | Fetch STIG Manager User Records
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stigman_internal_port }}/api/users"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    status_code: 200
  register: stigman_users
  tags:
    - stigman

- name: STIGMAN | Build Grants Payload for Collection Creation
  ansible.builtin.set_fact:
    collection_grants: "{{ raw_grants | from_json }}"
  vars:
    raw_grants: >-
      {% set grants_list = [] %}
      {% set target_usernames = [
            stigman_username,
            watcher_client_id,
            'service-account-' ~ watcher_client_id,
            'stigman-manager'
          ] %}
      {% for user in stigman_users.json %}
      {%   if user.username in target_usernames %}
      {%     set _ = grants_list.append({'userId': user.userId, 'roleId': 4}) %}
      {%   endif %}
      {% endfor %}
      {{ grants_list | to_json }}
  tags:
    - stigman

# ------------------------------------------------------------------
# Create Collection with Grants Included Atomically
# ------------------------------------------------------------------
- name: STIGMAN | Fetch existing STIG Manager Collections (Elevated)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stigman_internal_port }}/api/collections?elevate=true"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    status_code: 200
  register: existing_collections
  tags:
    - stigman

- name: STIGMAN | Create STIG Manager Collection with Manager Grants
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stigman_internal_port }}/api/collections"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ collection_name }}"
      description: "Initial collection created during automated deployment"
      grants: "{{ collection_grants }}"
    status_code: 201
  when: collection_name not in (existing_collections.json | map(attribute='name') | list)
  tags:
    - stigman

- name: STIGMAN | Fetch updated STIG Manager Collections list (Elevated)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stigman_internal_port }}/api/collections?elevate=true"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    status_code: 200
  register: updated_collections
  tags:
    - stigman

- name: STIGMAN | Set Collection ID fact
  ansible.builtin.set_fact:
    target_collection_id: >-
      {{
        (updated_collections.json
          | selectattr('name', 'eq', collection_name)
          | map(attribute='collectionId')
          | list
          | first)
      }}
  tags:
    - stigman

# ------------------------------------------------------------------
# Set up stigman watcher
# ------------------------------------------------------------------
- name: STIGMAN | Install @nuwcdivnpt/stigman-watcher globally via NPM
  ansible.builtin.npm:
    name: "@nuwcdivnpt/stigman-watcher"
    global: true
    state: present
  tags:
    - stigman

- name: STIGMAN | Deploy environment variable file for Watcher
  ansible.builtin.copy:
    dest: "/usr/local/lib/node_modules/@nuwcdivnpt/stigman-watcher/.env"
    owner: root
    group: root
    mode: '0600'
    content: |
      WATCHER_PATH={{ nfs_upload_folder }}
      WATCHER_API_BASE=http://127.0.0.1:{{ stigman_internal_port }}/api
      WATCHER_AUTHORITY=http://127.0.0.1:{{ keycloak_internal_port }}/realms/{{ stigman_keycloak_realm }}
      WATCHER_CLIENT_ID={{ watcher_client_id }}
      WATCHER_CLIENT_SECRET={{ watcher_client_secret }}
      WATCHER_COLLECTION={{ target_collection_id }}
      WATCHER_MODE=scan
      WATCHER_HISTORY_FILE=true
      WATCHER_HISTORY_WRITE_INTERVAL=15000
      WATCHER_SCAN_INTERVAL=60000
      WATCHER_CREATE_OBJECTS=true
  tags:
    - stigman


- name: STIGMAN | Create systemd unit file for STIGMan Watcher
  ansible.builtin.copy:
    dest: "/etc/systemd/system/stigman-watcher.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=STIG Manager Directory Watcher Daemon
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/usr/local/lib/node_modules/@nuwcdivnpt/stigman-watcher
      ExecStart=/usr/local/lib/node_modules/@nuwcdivnpt/stigman-watcher/index.js
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
  tags:
    - stigman

- name: STIGMAN | Enable and start STIGMan Watcher service
  ansible.builtin.systemd:
    name: stigman-watcher.service
    enabled: true
    daemon_reload: true
    state: started
  tags:
    - stigman

# ------------------------------------------------------------------
# Upload STIGs to STIGMAN Library
# ------------------------------------------------------------------
- name: STIGMAN | Ensure clean temp import directory exists on target host
  ansible.builtin.file:
    path: /tmp/stigs_import
    state: "{{ item }}"
    mode: '0755'
  loop:
    - absent
    - directory
  tags:
    - stigman

- name: STIGMAN | Unarchive STIG ZIPs from AAP Runner to target host
  ansible.builtin.unarchive:
    src: "{{ item }}"
    dest: /tmp/stigs_import/
    remote_src: false
  loop: "{{ query('ansible.builtin.fileglob', '*.zip') }}"
  loop_control:
    label: "{{ item | basename }}"
  tags:
    - stigman

- name: STIGMAN | Find extracted XCCDF XML files
  ansible.builtin.find:
    paths: /tmp/stigs_import
    patterns: "*.xml"
    recurse: true
  register: extracted_xmls
  tags:
    - stigman

- name: STIGMAN | Import STIG Library XML Files into STIG Manager
  ansible.builtin.command: >
    curl -s -w "\nHTTP_STATUS:%{http_code}"
    -X POST "http://127.0.0.1:{{ stigman_internal_port }}/api/stigs?elevate=true&clobber=true"
    -H "Authorization: Bearer {{ keycloak_token.json.access_token }}"
    -F "importFile=@{{ item.path }}"
  register: xml_upload_result
  failed_when: >
    'HTTP_STATUS:200' not in xml_upload_result.stdout and
    'HTTP_STATUS:201' not in xml_upload_result.stdout
  changed_when: >
    'HTTP_STATUS:200' in xml_upload_result.stdout or
    'HTTP_STATUS:201' in xml_upload_result.stdout
  loop: "{{ extracted_xmls.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags:
    - stigman

- name: STIGMAN | Clean up temp import directory
  ansible.builtin.file:
    path: /tmp/stigs_import
    state: absent
  tags:
    - stigman




# ------------------------------------------------------------------
# Stand up OpenRMF Application Stack
# ------------------------------------------------------------------
- name: OPENRMF | Unarchive OpenRMF release archive to target host
  ansible.builtin.unarchive:
    src: "{{ openrmf_zip_file }}"
    dest: "{{ openrmf_install_dir }}"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    remote_src: false
  tags:
    - openrmf

- name: OPENRMF | Remap openrmf-web host port in docker-compose.yml
  ansible.builtin.replace:
    path: "{{ openrmf_install_dir }}/docker-compose.yml"
    regexp: '8080:8080'
    replace: "127.0.0.1:{{ openrmf_internal_port }}:8080"
  tags:     # Not sure about this one, TODO
    - openrmf

- name: OPENRMF | Deploy docker-compose.override.yml for auth.js mount
  ansible.builtin.copy:
    dest: "{{ openrmf_install_dir }}/docker-compose.override.yml"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0644'
    content: |
      version: '3.7'
      services:
        openrmf-web:
          volumes:
            - ./auth.js:/usr/share/nginx/html/js/auth.js:z
  tags:
    - openrmf

- name: OPENRMF | Deploy OpenRMF .env configuration
  ansible.builtin.copy:
    dest: "{{ openrmf_install_dir }}/.env"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0600'
    content: |
      JWTAUTHORITY={{ auth_server_fqdn }}/realms/{{ openrmf_keycloak_realm }}
      JWTINTERNALAUTHORITY=http://host.containers.internal:{{ keycloak_internal_port }}/
      JWTCLIENT={{ openrmf_keycloak_realm }}
      OPENRMF_HOST={{ openrmf_server_fqdn }}
  tags:
    - openrmf

- name: OPENRMF | Deploy Keycloak JS config (auth.js)
  ansible.builtin.copy:
    dest: "{{ openrmf_install_dir }}/auth.js"
    owner: "{{ server_svc_account }}"
    group: "{{ server_svc_account }}"
    mode: '0644'
    content: |
      var keycloak = new Keycloak({
        url: '{{ auth_server_fqdn }}',
        realm: '{{ openrmf_keycloak_realm }}',
        clientId: '{{ openrmf_keycloak_realm }}'
      });
  tags:
    - openrmf

- name: OPENRMF | Convert compose scripts to use podman
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: 'docker compose'
    replace: 'podman compose'
  loop:
    - "{{ openrmf_install_dir }}/start.sh"
    - "{{ openrmf_install_dir }}/stop.sh"
  tags:
    - openrmf

- name: OPENRMF | Ensure OpenRMF execution scripts are executable
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0755'
  loop:
    - "{{ openrmf_install_dir }}/start.sh"
    - "{{ openrmf_install_dir }}/stop.sh"
  tags:
    - openrmf

- name: OPENRMF | Launch OpenRMF stack as service account # Ensure restart on reboot, not working now TODO
  ansible.builtin.command:
    cmd: "systemd-run --user --scope ./start.sh"
    chdir: "{{ openrmf_install_dir }}"
  become: true
  become_user: "{{ server_svc_account }}"
  environment:
    HOME: "/home/{{ server_svc_account }}"
    LOGNAME: "{{ server_svc_account }}"
    USER: "{{ server_svc_account }}"
    PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_facts['env']['PATH'] }}"
    XDG_RUNTIME_DIR: "/run/user/{{ stig_svc_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ stig_svc_uid.stdout }}/bus"
  register: openrmf_start
  changed_when: openrmf_start.rc == 0
  tags:
    - openrmf

# ------------------------------------------------------------------
# Embedded Host NGINX Proxy Setup
# ------------------------------------------------------------------
- name: General | Generate self-signed certificate with SAN for NGINX TLS
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout /etc/nginx/stigman_selfsigned.key
    -out /etc/nginx/stigman_selfsigned.crt
    -subj "/CN={{ app_server_ip }}/O=Local"
    -addext "subjectAltName=IP:{{ app_server_ip }},DNS:localhost"
  args:
    creates: /etc/nginx/stigman_selfsigned.crt
  tags:
    - general

- name: General | Deploy Embedded NGINX Reverse Proxy Configuration
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/rmf_apps_proxy.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Allow larger header buffers for Keycloak cookies and tokens
      large_client_header_buffers 4 32k;
      client_max_body_size 100M;

      # --------------------------------------------------
      # Keycloak Proxy Server Block
      # --------------------------------------------------
      server {
          listen {{ keycloak_host_port }} ssl;
          server_name _;

          ssl_certificate /etc/nginx/stigman_selfsigned.crt;
          ssl_certificate_key /etc/nginx/stigman_selfsigned.key;

          location / {
              proxy_pass http://127.0.0.1:{{ keycloak_internal_port }};
              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Port $server_port;
              
              proxy_buffer_size 128k;
              proxy_buffers 4 256k;
              proxy_busy_buffers_size 256k;
          }
      }

      # --------------------------------------------------
      # STIG Manager Proxy Server Block
      # --------------------------------------------------
      server {
          listen {{ stigman_host_port }} ssl;
          server_name _;

          ssl_certificate /etc/nginx/stigman_selfsigned.crt;
          ssl_certificate_key /etc/nginx/stigman_selfsigned.key;

          # Direct download endpoint for the self-signed TLS cert
          location = /cert.crt {
              alias /etc/nginx/stigman_selfsigned.crt;
              default_type application/x-x509-ca-cert;
              add_header Content-Disposition "attachment; filename=stigman_selfsigned.crt";
          }

          location / {
              proxy_pass http://127.0.0.1:{{ stigman_internal_port }};
              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Port $server_port;
          }
      }

      # --------------------------------------------------
      # OpenRMF Proxy Server Block
      # --------------------------------------------------
      server {
          listen {{ openrmf_host_port }} ssl;
          server_name _;

          ssl_certificate /etc/nginx/stigman_selfsigned.crt;
          ssl_certificate_key /etc/nginx/stigman_selfsigned.key;

          location / {
              proxy_pass http://127.0.0.1:{{ openrmf_internal_port }};
              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-Port $server_port;
          }
      }
  tags:
    - general

- name: General | Ensure NGINX service is started and enabled
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
    enabled: true
  tags:
    - general

